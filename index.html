<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Your Ascendant</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: rgb(6,15,30);
  }
  /* Locked single-screen layout: no vertical scroll */
  .app {
    height: 100vh;
    height: 100dvh;
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }
  /* Hero — same geometry as the artwork */
  .hero-wrap {
    padding-top: 2.199%;
    padding-left: 2.601%;
    padding-right: 5.583%;
    flex: 0 0 auto;
  }
  .hero {
    display: block;
    width: 100%;
    aspect-ratio: 4802 / 2043;
    object-fit: cover;
    background: rgb(6,15,30);
  }
  .block {
    display: block;
    width: 100%;
    flex: 0 0 auto;
  }
  /* Horizontal swipe carousel for the reading blocks */
  .carousel {
    display: flex;
    flex-direction: row;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    gap: 12px;
    align-items: center;
    flex: 0 0 auto;
    scrollbar-width: none;
  }
  .carousel::-webkit-scrollbar { display: none; }
  .card {
    flex: 0 0 85%;
    scroll-snap-align: center;
  }
  .card:first-child { margin-left: 7.5%; }
  .card:last-child { margin-right: 7.5%; }
  .card img {
    display: block;
    width: 100%;
  }
</style>
</head>
<body>
  <div class="app">
    <div class="hero-wrap">
      <video id="heroVid" class="hero" src="day-to-night.mp4" muted playsinline preload="auto"></video>
    </div>
    <img class="block" src="slice-birth-table.jpg" alt="">
    <div class="carousel">
      <div class="card"><img src="slice-ascendant.jpg" alt=""></div>
      <div class="card"><img src="slice-panel.jpg" alt=""></div>
    </div>
    <img class="block" src="slice-unlock.jpg" alt="">
  </div>
<script>
(function(){
  var v = document.getElementById('heroVid');
  var done = false;
  function start(){ v.play().catch(function(){}); }
  v.addEventListener('ended', function(){ done = true; }); // hold final pose
  v.addEventListener('pointerdown', function(){
    if (done) { done = false; v.currentTime = 0; v.play().catch(function(){}); }
  });
  start();
  document.addEventListener('pointerdown', function once(){
    if (v.paused && !done) start();
    document.removeEventListener('pointerdown', once);
  });
})();
</script>
</body>
</html>
