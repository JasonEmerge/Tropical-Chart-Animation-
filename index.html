<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Your Ascendant</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: rgb(6,15,30);
  }
  .page {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
  }
  /* Sky pinned at top — content scrolls up and disappears behind it */
  .hero-wrap {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgb(6,15,30);
    padding-top: 2.199%;
    padding-left: 2.601%;
    padding-right: 5.583%;
    padding-bottom: 8px;
  }
  .hero {
    display: block;
    width: 100%;
    aspect-ratio: 4802 / 2043;
    object-fit: cover;
    background: rgb(6,15,30);
  }
  .body-art {
    display: block;
    width: 100%;
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="hero-wrap">
      <video id="heroVid" class="hero" src="day-to-night.mp4" muted playsinline preload="auto"></video>
    </div>
    <img class="body-art" src="ascendant-body.jpg" alt="">
  </div>
<script>
(function(){
  var v = document.getElementById('heroVid');
  var done = false;
  function start(){ v.play().catch(function(){}); }
  v.addEventListener('ended', function(){ done = true; }); // hold final pose
  v.addEventListener('pointerdown', function(){
    if (done) { done = false; v.currentTime = 0; v.play().catch(function(){}); }
  });
  start();
  document.addEventListener('pointerdown', function once(){
    if (v.paused && !done) start();
    document.removeEventListener('pointerdown', once);
  });
})();
</script>
</body>
</html>
